# CODVAULT installé par le Hub. Les {{...}} sont remplacés à l'installation :
# secrets générés, port d'hôte, volume nommé, réseau partagé du Hub. Aucune
# capacité, aucun jeton de service : le Hub administre les comptes (jeton
# d'administration délégué au socle) et ne voit jamais le contenu des coffres.
services:
  codvault:
    image: ghcr.io/codexx64/codvault:{{config.IMAGE_TAG}}
    container_name: {{service.host}}
    restart: unless-stopped
    networks: [hub]
    ports:
      - "{{hostport.http}}:8175"
    volumes:
      - {{volume.data}}:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 96
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      DATA_DIR: /data
      PORT: "8175"
      CODVAULT_LOGOS: "{{config.CODVAULT_LOGOS}}"
      # Comptes : clé maîtresse gardée par le Hub (jamais sur le volume).
      SOCLE_CLE: "{{config.SOCLE_CLE}}"
      SOCLE_CLE_ANCIENNE: "{{config.SOCLE_CLE_ANCIENNE}}"
      SOCLE_HTTP: "{{config.SOCLE_HTTP}}"
      SOCLE_JETON_INSTALLATION: "{{config.SOCLE_JETON_INSTALLATION}}"
      SOCLE_JETON_ADMIN_HUB: "{{config.HUB_ADMIN_TOKEN}}"
      SOCLE_PROXYS: "{{config.SOCLE_PROXYS}}"
      SOCLE_ORIGINES: "{{config.SOCLE_ORIGINES}}"
      SOCLE_URL_PUBLIQUE: "{{config.SOCLE_URL_PUBLIQUE}}"
      SOCLE_THEME: "{{hub.theme}}"
      SOCLE_SMTP_HOTE: "{{config.SOCLE_SMTP_HOTE}}"
      SOCLE_SMTP_PORT: "{{config.SOCLE_SMTP_PORT}}"
      SOCLE_SMTP_SECURITE: "{{config.SOCLE_SMTP_SECURITE}}"
      SOCLE_SMTP_UTILISATEUR: "{{config.SOCLE_SMTP_UTILISATEUR}}"
      SOCLE_SMTP_MOTDEPASSE: "{{config.SOCLE_SMTP_MOTDEPASSE}}"
      SOCLE_SMTP_DE: "{{config.SOCLE_SMTP_DE}}"

networks:
  hub:
    name: {{hub.network}}
    external: true

volumes:
  {{volume.data}}:
    name: {{volume.data}}
